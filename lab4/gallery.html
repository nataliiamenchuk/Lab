<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея</title>
    <link rel="stylesheet" href="gallery_style.css">
</head>
<body>
<h1>Галерея Менчук Наталії Ігорівни</h1>
<p class="back-link"><a href="index.html">Назад на головну</a></p>
<h2>Мої зображення</h2>

<div class="row">
    <div class="col col-lg-4 col-md-6 col-sm-12">
        <h3 class="title-smaller">Зображення у цій папці</h3>
        <p class="img-center">
            <img src="photo1.svg" alt="Зображення 640x480 у поточній папці" width="640" height="480">
        </p>
    </div>

    <div class="col col-lg-4 col-md-6 col-sm-12">
        <h3 class="title-larger">Зображення у папці</h3>
        <p class="img-center">
            <img src="images/photo2.svg" alt="Зображення 640x480 у підпапці images" width="640" height="480">
        </p>
    </div>

    <div class="col col-lg-4 col-md-12 col-sm-12">
        <h3 class="title-largest">Зображення онлайн</h3>
        <p class="img-center">
            <img src="https://placehold.co/1280x1024.png" alt="Зображення 1280x1024 онлайн" width="1280" height="1024">
        </p>
    </div>
</div>
</body>
</html>
